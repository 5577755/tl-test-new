# FUZZ_ARI 随机激励配置（tl-test-new DPI Guest Mode，coupledL2-test-l2l3）。
# 与 tltest.ini 的区别：
#   - CAgent(l1d) 换成 FUZZ_ARI 随机事务（每周期一次 acquire/release/CMO 抽签，
#     地址在 3 种范围间轮换：全随机 / 1 tag×16 set / 16 tag×1 set），
#     ULAgent(l1i) 与 MAgent(matrix) 置 PASSIVE 不发包 —— 首轮先归因单一激励源
#   - 打开 CMO（cbo.clean/flush/inval 1/8 概率 alwaysHit），
#     主打 l3.sinkA/sinkC/sourceB 等报告中的 fuzz 目标模块
#   - maximum_cycle=2M 兜底；正常由 ari.target=18 轮换结束（~540K 周期）
# 运行：HBL2_VCS_INI=run/tltest_fuzz_ari.ini vcs/run_vcs.sh coverage-fuzz fuzz_ari_s1000
# （换 seed 改 [tltest.fuzzer] seed 后另存 ini，vdb 名带 seed 便于合并对比）

[tltest.config]
maximum_cycle               = 20000
memory.enable               = 1
memory.start                = 0x00000000
memory.end                  = 0x00080000 # ~0x0007FFFF
memory.backend.ooor         = 0
memory.backend.rd.depth     = 0
memory.backend.rd.latency   = 0
memory.backend.wr.depth     = 0
memory.backend.wr.latency   = 0
memory.backend.cycle_unit   = 2
memory.backend.port.count   = 1
memory.sync.strict          = 0
mmio.enable                 = 0
mmio.start                  = 0
mmio.end                    = 0
cmo.enable                  = 1
cmo.enable.cbo.clean        = 1
cmo.enable.cbo.flush        = 0
cmo.enable.cbo.inval        = 0
cmo.start                    = 0x10000000
cmo.end                      = 0x14000000
cmo.parallel.depth          = 0

[tltest.sequence]
# mode.0                      = FUZZ_STREAM_GS
# mode.1                      = FUZZ_STREAM_GS

[tltest.profile]
cycle_unit                  = 2

[tltest.fuzzer]
seed                        = 1000
# TraceDispatcher 无条件打开 trace.file.path（空路径直接 exit）。这里指向一条
# agentId 越界（=9，系统只有 0/1/2）的占位记录：dispatcher 永远派不出去，
# 既不注入额外激励，也保证 empty() 为假，不会在第一拍就触发结束事件。
trace.file.path             = /nfs/home/xiaokaiyuan/Project/HBL2-Test/tl-test-new-matrix/traces/fuzz_idle.txt
ari.interval                = 1000
ari.target                  = 1
stream.interval             = 100
stream.step                 = 0x40
stream.start                = 0x00000000
stream.end                  = 0x00080000 # ~0x0007FFFF

[tltest.logger]
verbose                     = 0
verbose.xact_fired          = 1
verbose.xact_sequenced      = 0
verbose.xact_data_complete  = 0
verbose.memory.axi_write    = 0
verbose.memory.axi_read     = 0
verbose.data_full           = 0
verbose.agent_debug         = 0

# coupledL2-test-l2l3
[tltest.config]
core                        = 1
core.tl_c                   = 1
core.tl_ul                  = 1
core.tl_m                   = 1
maximum_cycle               = 20000
memory.start                = 0x00000000
memory.end                  = 0x80000000
cmo.enable                  = 1
cmo.enable.cbo.clean        = 1
cmo.enable.cbo.flush        = 0
cmo.enable.cbo.inval        = 0
cmo.start                   = 0x10000000
cmo.end                     = 0x14000000

cache.cagent.sets           = 128
cache.cagent.ways           = 8
[tltest.sequence]
mode.0                     = FUZZ_ARI
mode.1                     = PASSIVE
mode.2                     = PASSIVE
